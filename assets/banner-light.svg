<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Sanket Joshi — Azure Cloud Architect &amp; DevOps Engineer</title>
  <desc id="d">Microsoft MVP (Azure), based in Helsinki, Finland.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fd"/><stop offset="1" stop-color="#e8eefb"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0369a1" stop-opacity="0.35"/><stop offset="1" stop-color="#0369a1" stop-opacity="0"/></radialGradient>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#0369a1"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
  </defs>
  <style>
    .spin { transform-origin: 975px 150px; animation: spin 36s linear infinite; }
    .spin2 { transform-origin: 975px 150px; animation: spin 22s linear infinite reverse; }
    .pulse { animation: pulse 3.2s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: .35; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .spin, .spin2, .pulse, .cursor { animation: none; } }
  </style>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="40" cy="40" r="1.2" fill="#6b7bb0" opacity="0.5"/><circle cx="160" cy="260" r="1" fill="#6b7bb0" opacity="0.4"/><circle cx="420" cy="30" r="1.4" fill="#6b7bb0" opacity="0.5"/><circle cx="560" cy="270" r="1" fill="#6b7bb0" opacity="0.35"/><circle cx="640" cy="60" r="1.2" fill="#6b7bb0" opacity="0.45"/><circle cx="1180" cy="40" r="1" fill="#6b7bb0" opacity="0.4"/><circle cx="1150" cy="270" r="1.3" fill="#6b7bb0" opacity="0.5"/><circle cx="760" cy="250" r="1" fill="#6b7bb0" opacity="0.35"/><circle cx="300" cy="280" r="1.1" fill="#6b7bb0" opacity="0.4"/><circle cx="700" cy="20" r="1" fill="#6b7bb0" opacity="0.3"/>
  <text x="80" y="92" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="17" fill="#0369a1">~/helsinki $ whoami<tspan class="cursor">▍</tspan></text>
  <text x="78" y="160" font-family="'Instrument Serif',Georgia,'Times New Roman',serif" font-size="64" fill="#0d1430">Sanket Joshi</text>
  <rect x="80" y="178" width="120" height="3" rx="1.5" fill="url(#line)"/>
  <text x="80" y="214" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#0d1430">Azure Cloud Architect &amp; DevOps Engineer</text>
  <text x="80" y="246" font-family="'Segoe UI','Inter',Helvetica,Arial,sans-serif" font-size="17" fill="#44507a">Microsoft MVP (Azure) · Senior AI Engineer at Tieto · Helsinki, Finland</text>
  <circle cx="975" cy="150" r="120" fill="url(#glow)"/>
  <g class="spin">
    <ellipse cx="975" cy="150" rx="140" ry="52" fill="none" stroke="rgba(3,105,161,0.25)" stroke-width="1.5" transform="rotate(-18 975 150)"/>
    <circle cx="1108" cy="107" r="6" fill="#0369a1"/>
    <circle cx="842" cy="193" r="4" fill="#6d28d9"/>
  </g>
  <g class="spin2">
    <ellipse cx="975" cy="150" rx="104" ry="104" fill="none" stroke="rgba(3,105,161,0.25)" stroke-width="1.2" stroke-dasharray="3 7"/>
    <circle cx="975" cy="46" r="5" fill="#6d28d9"/>
    <circle cx="1079" cy="150" r="3.5" fill="#0369a1"/>
  </g>
  <circle cx="975" cy="150" r="46" fill="#f7f9fd" stroke="url(#line)" stroke-width="2"/>
  <text x="975" y="162" text-anchor="middle" font-family="'Instrument Serif',Georgia,serif" font-size="34" fill="#0d1430">SJ</text>
  <circle class="pulse" cx="1008" cy="118" r="6" fill="#34d399" stroke="#f7f9fd" stroke-width="2"/>
</svg>
